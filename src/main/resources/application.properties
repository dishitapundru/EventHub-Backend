spring.application.name=eventhub-backend

server.port=${PORT:8080}

# Database
# Local: MySQL
# Render: PostgreSQL through environment variables
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/eventhub}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Database driver
spring.datasource.driver-class-name=${DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}

# Logging
logging.level.org.springframework.web=INFO